; DisplayBMS - JK PB-series BMS display on CYD (ESP32-2432S028R)
; Platform pinned: espressif32 7.1.2 ships framework-espidf 4.60100.0 (ESP-IDF 6.1.0),
; same as the reference project (fungen).

[env:cyd]
platform = platformio/espressif32@7.1.2
board = esp32dev
framework = espidf

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
